name: train

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject to train (coding/bangla/english)"
        default: "bangla"
      max_iters:
        description: "Training iterations"
        default: "1500"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build subject data
        run: python make_data.py ${{ github.event.inputs.subject }}
      - name: Train
        run: DATA_FILE=data_${{ github.event.inputs.subject }}.txt OUT_FILE=model_${{ github.event.inputs.subject }}.pt MAX_ITERS=${{ github.event.inputs.max_iters }} EVAL_EVERY=250 python train.py
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.event.inputs.subject }}
          path: model_${{ github.event.inputs.subject }}.pt
